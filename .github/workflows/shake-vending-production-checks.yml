name: Shake Vending Production Checks

on:
  push:
    branches: [shake-vending-production]
    paths:
      - 'shake-vending-game/**'
      - '.github/workflows/shake-vending-production-checks.yml'
  pull_request:
    paths:
      - 'shake-vending-game/**'
      - '.github/workflows/shake-vending-production-checks.yml'

permissions:
  contents: read

concurrency:
  group: shake-vending-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shake-vending-game
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static structural audit
        run: python tools/static_check.py
      - name: Presentation persistence audit
        run: python tools/presentation_check.py
      - name: Visual quality source audit
        run: python tools/visual_quality_check.py
      - name: Audio architecture audit
        run: python tools/audio_quality_check.py
      - name: Mobile and accessibility audit
        run: python tools/mobile_accessibility_check.py
      - name: Performance architecture audit
        run: python tools/performance_check.py
      - name: Economy and progression loop simulation
        run: python tools/loop_sim.py
