<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>⚽ Football Wordle</title>
<style>
  :root{
    --bg:#0b0c10; --panel:#111827; --tile:#1f2937; --ink:#e5e7eb;
    --correct:#6aaa64; --present:#c9b458; --absent:#787c7e;
    --accent:#22d3ee; --muted:#9ca3af;
  }
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(1200px 600px at 85% -10%,rgba(34,211,238,.12),transparent),
              radial-gradient(900px 500px at -10% 10%,rgba(99,102,241,.12),transparent),
              var(--bg);
    color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Ubuntu,"Helvetica Neue",Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  .app{width:min(95vw,720px); display:grid; grid-template-rows:auto auto 1fr auto; gap:14px}
  header{display:flex; align-items:center; justify-content:space-between; padding:10px 4px}
  .title{font-weight:800; letter-spacing:.5px}
  .pill{font-size:.85rem; color:var(--bg); background:linear-gradient(90deg,#22d3ee,#60a5fa);
        padding:6px 10px; border-radius:999px; user-select:none}
  .panel{background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.06); border-radius:14px}
  .board{display:grid; grid-template-rows:repeat(6,1fr); gap:8px; padding:16px}
  .row{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
  .tile{
    aspect-ratio:1/1; display:grid; place-items:center; font-weight:800; font-size:1.35rem;
    text-transform:uppercase; border-radius:10px; background:var(--tile); border:1px solid rgba(255,255,255,.06);
    transition:transform .1s ease;
  }
  .tile.filled{border-color:#8ab4f8}
  .tile.correct{background:var(--correct); color:white; border-color:var(--correct)}
  .tile.present{background:var(--present); color:white; border-color:var(--present)}
  .tile.absent{background:var(--absent); color:white; border-color:var(--absent)}
  .flip{animation:flip .6s ease forwards}
  @keyframes flip{
    0%{transform:rotateX(0)}
    49%{transform:rotateX(90deg)}
    50%{transform:rotateX(-90deg)}
    100%{transform:rotateX(0)}
  }
  .kbd{display:grid; gap:8px; padding:16px}
  .rowk{display:flex; justify-content:center; gap:8px}
  .key{
    background:#1f2937; color:var(--ink); border:1px solid rgba(255,255,255,.08);
    min-width:36px; height:48px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-weight:700; cursor:pointer; user-select:none; padding:0 10px; transition:transform .05s ease,background .2s ease;
  }
  .key:hover{transform:translateY(-1px)}
  .key.big{min-width:64px}
  .key.correct{background:var(--correct); color:white; border-color:var(--correct)}
  .key.present{background:var(--present); color:white; border-color:var(--present)}
  .key.absent{background:var(--absent); color:white; border-color:var(--absent)}
  .bar{display:flex; align-items:center; gap:10px; padding:8px 14px 16px; color:var(--muted); font-size:.95rem; flex-wrap:wrap}
  .btn{
    background:transparent; color:var(--ink); border:1px solid rgba(255,255,255,.18); padding:8px 12px; border-radius:10px;
    cursor:pointer; font-weight:700;
  }
  .btn.primary{background:linear-gradient(90deg,#22d3ee,#60a5fa); color:#0b0c10; border:none}
  .toast{position:fixed; top:18px; left:50%; transform:translateX(-50%); background:#111827; color:var(--ink);
         padding:10px 14px; border:1px solid rgba(255,255,255,.12); border-radius:10px; opacity:0; pointer-events:none}
  .toast.show{opacity:1; animation:fade .9s ease}
  @keyframes fade{0%{opacity:0; transform:translate(-50%,-8px)} 15%,85%{opacity:1; transform:translate(-50%,0)} 100%{opacity:0; transform:translate(-50%,-8px)}}
  details{padding:0 6px 12px}
  summary{cursor:pointer; color:#93c5fd}
  .list{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px}
  .chip{background:#0f172a; border:1px solid rgba(255,255,255,.08); padding:4px 8px; border-radius:999px; font-size:.8rem; color:#cbd5e1}
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">⚽ Football Wordle</div>
      <div class="pill" id="modePill">Daily</div>
    </header>

    <div class="panel board" id="board" aria-live="polite"></div>

    <div class="panel kbd" id="keyboard" aria-label="On-screen keyboard"></div>

    <div class="bar">
      <button class="btn" id="toggleMode" title="Switch between Daily and Random">Toggle Daily/Random</button>
      <button class="btn primary" id="restart">New Game</button>
      <span id="status" role="status"></span>
      <details>
        <summary>Allowed answers (footballers)</summary>
        <div class="list" id="chips"></div>
      </details>
    </div>
  </div>

  <div class="toast" id="toast">Not in list</div>

<script>
(() => {
  // === 5-letter football names (first or last names; ASCII only) ===
  const WORDS = [
    "MESSI","SALAH","KANTE","KROOS","PIRLO","HENRY","ALABA","FODEN","PEDRI","MOUNT",
    "PUYOL","XHAKA","KEANE","REINA","JAMES","NEUER","KLOSE","ALVES","TOURE","SILVA",
    "MENDY","OBLAK","NAVAS","OSCAR","PAVON","PEREZ","VIDAL","RAMOS","JOVIC","FELIX",
    "KROOS","PEDRO","HAKAN","ROBIN","KOHLI","ISNER" // last two are extras; feel free to remove/replace
  ];
  // Remove duplicates just in case
  const UNIQUE = Array.from(new Set(WORDS.map(w => w.toUpperCase().replace(/[^A-Z]/g,'')))).filter(w => w.length===5);

  // DOM
  const boardEl = document.getElementById('board');
  const keyboardEl = document.getElementById('keyboard');
  const statusEl = document.getElementById('status');
  const modePill = document.getElementById('modePill');
  const toastEl = document.getElementById('toast');
  const chipsEl = document.getElementById('chips');

  // Settings
  const ROWS = 6, COLS = 5;
  let dailyMode = true;
  let target = pickWord();
  let row = 0, col = 0, gameOver = false;

  // Build chips list (answers preview)
  chipsEl.innerHTML = '';
  UNIQUE.forEach(w => {
    const s = document.createElement('span');
    s.className = 'chip';
    s.textContent = w;
    chipsEl.appendChild(s);
  });

  // Build board UI
  function buildBoard(){
    boardEl.innerHTML = '';
    for(let r=0;r<ROWS;r++){
      const rowEl = document.createElement('div'); rowEl.className='row';
      for(let c=0;c<COLS;c++){
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.setAttribute('data-r', r);
        tile.setAttribute('data-c', c);
        tile.setAttribute('aria-label', `Row ${r+1} Column ${c+1}`);
        rowEl.appendChild(tile);
      }
      boardEl.appendChild(rowEl);
    }
  }
  buildBoard();

  // Build keyboard
  const layout = ["QWERTYUIOP","ASDFGHJKL","ENTERZXCVBNM⌫"];
  function buildKeyboard(){
    keyboardEl.innerHTML='';
    layout.forEach((rowKeys,i)=>{
      const rowk = document.createElement('div'); rowk.className='rowk';
      for(const ch of rowKeys){
        const key = document.createElement('button');
        key.className = 'key';
        if(ch==='E' && rowKeys.startsWith('ENTER')) continue; // handled as full word
        if(ch==='⌫') key.classList.add('big');
        key.textContent = (ch==='⌫' ? '⌫' : ch);
        key.dataset.key = (ch==='⌫' ? 'BACKSPACE' : ch);
        rowk.appendChild(key);
      }
      // Add "ENTER" button explicitly at row 3 start
      if(i===2){
        const enter = document.createElement('button');
        enter.className='key big';
        enter.textContent='ENTER';
        enter.dataset.key='ENTER';
        rowk.prepend(enter);
      }
      keyboardEl.appendChild(rowk);
    });
  }
  buildKeyboard();

  // Keyboard events
  keyboardEl.addEventListener('click', (e)=>{
    const btn = e.target.closest('.key'); if(!btn) return;
    onKey(btn.dataset.key);
  });
  window.addEventListener('keydown', (e)=>{
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    let k = e.key;
    if(k==='Enter') k='ENTER';
    if(k==='Backspace') k='BACKSPACE';
    if(/^[a-z]$/i.test(k)) k = k.toUpperCase();
    onKey(k);
  });

  // Controls
  document.getElementById('restart').addEventListener('click', ()=>resetGame());
  document.getElementById('toggleMode').addEventListener('click', ()=>{
    dailyMode = !dailyMode; modePill.textContent = dailyMode?'Daily':'Random';
    resetGame();
  });

  function resetGame(){
    target = pickWord(); row=0; col=0; gameOver=false;
    statusEl.textContent = '';
    buildBoard(); paintKeyboard({});
  }

  function pickWord(){
    if(dailyMode){
      const d = new Date();
      const key = (d.getUTCFullYear()*10000)+(d.getUTCMonth()+1)*100 + d.getUTCDate(); // yyyymmdd
      return UNIQUE[key % UNIQUE.length];
    } else {
      return UNIQUE[Math.floor(Math.random()*UNIQUE.length)];
    }
  }

  function onKey(k){
    if(gameOver) return;
    if(/^[A-Z]$/.test(k)){
      if(col<COLS){
        const tile = tileAt(row,col);
        tile.textContent = k;
        tile.classList.add('filled');
        col++;
      }
    } else if(k==='BACKSPACE'){
      if(col>0){
        col--;
        const tile = tileAt(row,col);
        tile.textContent = '';
        tile.classList.remove('filled');
      }
    } else if(k==='ENTER'){
      submit();
    }
  }

  function tileAt(r,c){ return boardEl.children[r].children[c]; }

  function submit(){
    if(col<COLS){ return toast("Not enough letters"); }
    const guess = getGuess();
    if(!/^[A-Z]{5}$/.test(guess)) return toast("Letters only");
    // Optional: require guess to be a footballer from list
    if(!UNIQUE.includes(guess)) return toast("Not in football list");

    // Score with duplicate-aware pass
    const result = scoreGuess(guess, target);
    animateRow(result, guess);

    if(guess===target){
      gameOver = true;
      statusEl.textContent = `Goal! You guessed ${target} in ${row+1}/${ROWS}.`;
    } else if(row===ROWS-1){
      gameOver = true;
      statusEl.textContent = `Full time! The word was ${target}.`;
    } else {
      row++; col=0;
    }
  }

  function getGuess(){
    let s=''; for(let c=0;c<COLS;c++){ s += tileAt(row,c).textContent || ''; }
    return s.toUpperCase();
  }

  function scoreGuess(guess, answer){
    const res = Array(COLS).fill('absent');
    const counts = {};
    for(const ch of answer) counts[ch]=(counts[ch]||0)+1;

    // First pass: correct
    for(let i=0;i<COLS;i++){
      if(guess[i]===answer[i]){
        res[i]='correct';
        counts[guess[i]]--;
      }
    }
    // Second pass: present
    for(let i=0;i<COLS;i++){
      if(res[i]==='correct') continue;
      const ch = guess[i];
      if(counts[ch]>0){
        res[i]='present';
        counts[ch]--;
      }
    }
    return res;
  }

  function animateRow(result, guess){
    const kbUpdates = {};
    for(let i=0;i<COLS;i++){
      const tile = tileAt(row,i);
      setTimeout(()=>{
        tile.classList.add('flip');
        setTimeout(()=>{
          tile.classList.remove('flip');
          tile.classList.remove('filled');
          tile.classList.add(result[i]);
          kbUpdates[guess[i]] = better(kbUpdates[guess[i]], result[i]);
          paintKeyboard(kbUpdates);
        }, 300);
      }, i*220);
    }
  }

  function better(prev, now){
    // precedence: correct > present > absent
    const rank = {absent:0, present:1, correct:2};
    if(!prev) return now;
    return rank[now] > rank[prev] ? now : prev;
  }

  function paintKeyboard(extra){
    // apply known states + extra updates
    const states = {};
    document.querySelectorAll('.key').forEach(k=>{
      k.classList.remove('correct','present','absent');
    });
    // Collect from board
    for(let r=0;r<=row;r++){
      const isCurrent = (r===row);
      for(let c=0;c<COLS;c++){
        const t = tileAt(r,c);
        const ch = t.textContent;
        if(!ch) continue;
        const cls = t.classList.contains('correct')?'correct':
                    t.classList.contains('present')?'present':
                    t.classList.contains('absent')?'absent':null;
        if(cls) states[ch]=better(states[ch], cls);
        if(isCurrent && !cls) states[ch]=better(states[ch], 'filled');
      }
    }
    // Merge extra
    for(const k in extra){ states[k]=better(states[k], extra[k]); }
    // Paint
    document.querySelectorAll('.key').forEach(k=>{
      const ch = k.dataset.key;
      if(!/^[A-Z]$/.test(ch)) return;
      const s = states[ch];
      if(s==='correct'||s==='present'||s==='absent') k.classList.add(s);
    });
  }

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.remove('show');
    // Force reflow to restart animation
    void toastEl.offsetWidth;
    toastEl.classList.add('show');
  }

  // Initialize pill
  modePill.textContent = dailyMode ? 'Daily' : 'Random';
})();
</script>
</body>
</html>
