<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🌟 Ultimate Game Hub — Professional Edition</title>
<style>
 /* 🎨 HIGH-END VARIABLES */
 :root{
   --bg: #050505;
   --panel: rgba(20, 25, 35, 0.75);
   --border: rgba(255, 255, 255, 0.1);
   --ink: #f0f2f5;
   --muted: #94a3b8;
   --accent: #3b82f6;
   --good: #22c55e;
   --warn: #eab308;
   --bad: #ef4444;
   --tile-empty: rgba(255, 255, 255, 0.03);
   --tile-border: rgba(255, 255, 255, 0.1);
   --shadow: 0 10px 40px -10px rgba(0,0,0,0.5);
 }
  html,body{height:100%;}
 body{
   margin:0; background:var(--bg); color:var(--ink);
   font-family: 'Inter', system-ui, -apple-system, sans-serif;
   display:flex; align-items:center; justify-content:center;
   overflow:hidden;
 }


 /* ===== 1. BACKGROUND VFX ===== */
 .bg-gradient {
   position: fixed; inset: -50%;
   background: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.15), transparent 60%);
   animation: pulseGlow 10s ease-in-out infinite alternate;
   z-index: -2;
 }
 .bg-aurora {
   position: fixed; inset: 0; opacity: 0.4; z-index: -1;
   background: conic-gradient(from 0deg at 50% 50%, #0f172a, #1e1b4b, #312e81, #1e1b4b, #0f172a);
   filter: blur(80px);
 }
 canvas#particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.6; }
  @keyframes pulseGlow { 0%{opacity:0.5; transform:scale(1);} 100%{opacity:1; transform:scale(1.2);} }


 /* ===== 2. APP CONTAINER ===== */
 .app {
   width: min(100vw, 1200px); height: 100%;
   display: grid; grid-template-rows: auto auto 1fr auto;
   gap: 15px; padding: 15px; box-sizing: border-box;
   position: relative; z-index: 2;
 }


 /* ===== 3. HEADER ===== */
 header {
   display: flex; justify-content: space-between; align-items: center;
   background: var(--panel); backdrop-filter: blur(12px);
   border: 1px solid var(--border); border-radius: 16px;
   padding: 12px 20px; box-shadow: var(--shadow);
 }
 .brand { display: flex; align-items: center; gap: 12px; }
 .logo-icon { font-size: 1.8rem; filter: drop-shadow(0 0 10px rgba(255,255,255,0.3)); animation: float 3s ease-in-out infinite; }
 .logo-text {
   font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px;
   background: linear-gradient(135deg, #fff, var(--accent));
   -webkit-background-clip: text; color: transparent;
 }
 @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }


 /* CONTROLS */
 .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
 .btn {
   background: rgba(255,255,255,0.05); border: 1px solid var(--border);
   color: var(--muted); padding: 8px 14px; border-radius: 8px;
   font-size: 0.85rem; font-weight: 600; cursor: pointer;
   transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
 }
 .btn:hover { background: rgba(255,255,255,0.1); color: #fff; transform: translateY(-1px); border-color: rgba(255,255,255,0.3); }
 .btn.active { background: var(--accent); color: #000; border-color: transparent; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
 .btn.quit { border-color: rgba(239, 68, 68, 0.3); color: #fca5a5; }
 .btn.quit:hover { background: rgba(239, 68, 68, 0.2); border-color: var(--bad); }


 select {
   background: #0f1218; color: #fff; border: 1px solid var(--border);
   padding: 8px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; outline: none; max-width: 150px;
 }
 select:disabled { opacity: 0.5; cursor: not-allowed; }


 .lives-sel {
   display: flex; gap: 2px; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 4px;
 }
 .l-opt {
   padding: 4px 8px; cursor: pointer; border-radius: 4px; font-size: 0.8rem; font-weight: bold;
   color: var(--muted); transition: all 0.2s;
 }
 .l-opt:hover { color: #fff; background: rgba(255,255,255,0.1); }
 .l-opt.active { background: var(--accent); color: #000; }
 .lives-sel.locked { opacity: 0.5; pointer-events: none; }


 /* ===== 4. GAME BOARD AREA ===== */
 .board-container {
   background: var(--panel); backdrop-filter: blur(12px);
   border: 1px solid var(--border); border-radius: 20px;
   box-shadow: var(--shadow);
   display: flex; flex-direction: column; align-items: center; justify-content: center;
   overflow-y: auto; padding: 20px; position: relative;
   transition: border-color 0.3s;
 }
 .board-container.shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; border-color: var(--bad); }
  @keyframes shake { 10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(3px)} 30%,50%,70%{transform:translateX(-4px)} 40%,60%{transform:translateX(4px)} }


 /* HANGMAN TILES */
 .hangman-wrap { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; perspective: 1000px; }
 .hm-tile {
   width: 45px; height: 60px; display: flex; align-items: center; justify-content: center;
   background: var(--tile-empty); border: 1px solid var(--tile-border); border-radius: 10px;
   font-size: 1.8rem; font-weight: 800; color: #fff;
   transform-style: preserve-3d; transition: transform 0.4s;
   box-shadow: 0 4px 6px rgba(0,0,0,0.1);
 }
 .hm-tile.space { background: transparent; border: none; box-shadow: none; width: 20px; }
 .hm-tile.revealed {
   background: rgba(34, 197, 94, 0.2); border-color: var(--good); color: var(--good);
   animation: flipIn 0.5s ease forwards;
   box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
 }


 /* WORDLE / QUORDLE GRIDS */
 .grid-wrap { display: flex; gap: 20px; overflow-y: auto; max-height: 100%; padding: 10px; }
 .grid-wrap.quordle { display: grid; grid-template-columns: 1fr 1fr; width: 100%; max-width: 800px; gap: 15px; }
  .wordle-board { display: grid; gap: 5px; margin: 0 auto; opacity: 1; transition: opacity 0.3s; }
 .wordle-board.solved { opacity: 0.5; filter: grayscale(0.8); }
  .w-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
 .w-tile {
   width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
   background: var(--tile-empty); border: 2px solid var(--tile-border); border-radius: 6px;
   font-size: 1.6rem; font-weight: 700; text-transform: uppercase;
   transition: all 0.2s;
 }
 .quordle .w-tile { width: 32px; height: 32px; font-size: 1rem; border-width: 1px; }


 .w-tile.filled { border-color: var(--muted); animation: pop 0.1s ease; }
 .w-tile.correct { background: var(--good); border-color: var(--good); color: #000; animation: flipIn 0.5s ease; }
 .w-tile.present { background: var(--warn); border-color: var(--warn); color: #000; animation: flipIn 0.5s ease; }
 .w-tile.absent { background: rgba(255,255,255,0.08); border-color: transparent; opacity: 0.7; animation: flipIn 0.5s ease; }


 @keyframes flipIn { 0%{transform: rotateX(0);} 50%{transform: rotateX(90deg);} 100%{transform: rotateX(0);} }
 @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.1)} 100%{transform:scale(1)} }


 /* ===== 5. KEYBOARD ===== */
 .kbd-container {
   background: var(--panel); backdrop-filter: blur(12px);
   border: 1px solid var(--border); border-radius: 16px;
   padding: 10px; box-shadow: var(--shadow);
 }
 .rowk { display: flex; justify-content: center; gap: 6px; margin-bottom: 6px; }
 .key {
   flex: 1; height: 50px; min-width: 32px; max-width: 55px;
   display: flex; align-items: center; justify-content: center;
   background: #2a303c; border-radius: 6px; border-bottom: 3px solid #1a1e26;
   color: #fff; font-weight: 600; cursor: pointer; transition: all 0.1s;
   user-select: none;
 }
 .key:active { transform: translateY(2px); border-bottom-width: 0; }
 .key#ENTER, .key#BACK { flex: 1.5; font-size: 0.75rem; background: #374151; }
  .key.correct { background: var(--good); border-color: #15803d; color: #000; }
 .key.present { background: var(--warn); border-color: #a16207; color: #000; }
 .key.absent { background: #1f2937; border-color: transparent; opacity: 0.4; }
  .key.used-good { background: rgba(34, 197, 94, 0.3); border: 1px solid var(--good); color: var(--good); }
 .key.used-bad { background: rgba(239, 68, 68, 0.2); opacity: 0.5; }


 /* ===== 6. STATUS & OVERLAY ===== */
 .status-bar {
   display: flex; justify-content: center; gap: 20px;
   font-size: 1rem; color: var(--muted); font-weight: 500;
 }
 .stat-item { display: flex; align-items: center; gap: 8px; }
 .hearts { display: flex; gap: 4px; }
 .heart { width: 14px; height: 14px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 10px #ef4444; }
  .overlay {
   position: fixed; inset: 0; z-index: 100;
   background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
   display: none; place-items: center;
   animation: fadeIn 0.3s ease;
 }
 .modal {
   background: #161b22; border: 1px solid var(--border); border-radius: 24px;
   padding: 40px; text-align: center; max-width: 400px; width: 90%;
   box-shadow: 0 20px 50px rgba(0,0,0,0.7);
   transform: scale(0.9); animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
 }
 @keyframes zoomIn { to { transform: scale(1); } }


 .red-flash {
   position: fixed; inset: 0; background: radial-gradient(circle, transparent 60%, rgba(239, 68, 68, 0.3));
   z-index: 50; pointer-events: none; opacity: 0; transition: opacity 0.2s;
 }
 .red-flash.active { opacity: 1; }
  @media(max-width: 600px){
   .quordle .w-tile { width: 20px; height: 20px; font-size: 0.7rem; border-width: 1px; }
   .key { height: 45px; }
   .logo-text { display: none; }
 }
</style>

 /* --- 3. PARTICLE SYSTEM --- */
 function initParticles(){
   const cvs = document.getElementById('particles');
   const ctx = cvs.getContext('2d');
   let w, h, particles = [];
   const resize = () => { w = cvs.width = window.innerWidth; h = cvs.height = window.innerHeight; };
   window.addEventListener('resize', resize);
   resize();
   class P {
     constructor(){ this.reset(); }
     reset(){
       this.x = Math.random()*w; this.y = Math.random()*h;
       this.vx = (Math.random()-0.5)*0.5; this.vy = (Math.random()-0.5)*0.5;
       this.r = Math.random()*2; this.a = Math.random()*0.5;
     }
     update(){
       this.x+=this.vx; this.y+=this.vy;
       if(this.x<0 || this.x>w || this.y<0 || this.y>h) this.reset();
     }
     draw(){
       ctx.fillStyle = `rgba(255,255,255,${this.a})`;
       ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
     }
   }
   for(let i=0; i<40; i++) particles.push(new P());
   function loop(){
     ctx.clearRect(0,0,w,h);
     particles.forEach(p => { p.update(); p.draw(); });
     ctx.strokeStyle = `rgba(255,255,255,0.03)`;
     for(let i=0; i<particles.length; i++){
       for(let j=i+1; j<particles.length; j++){
         const dx = particles[i].x - particles[j].x;
         const dy = particles[i].y - particles[j].y;
         const dist = Math.sqrt(dx*dx + dy*dy);
         if(dist < 100){
           ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y);
           ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke();
         }
       }
     }
     requestAnimationFrame(loop);
   }
   loop();
 }


 /* --- 4. INIT --- */
 function init(){
   initParticles();
  
   for(const [k,v] of Object.entries(META)){
     const o = document.createElement('option');
     o.value = k; o.textContent = v.title;
     el.theme.appendChild(o);
   }


   // Lives Selector Logic
   el.livesOpts.forEach(opt => {
     opt.onclick = () => {
       if(isPlaying && hasInteracted) return;
       el.livesOpts.forEach(o => o.classList.remove('active'));
       opt.classList.add('active');
       customLives = parseInt(opt.dataset.v);
       if(isPlaying && !hasInteracted && currentMode === 'classic') {
           setupHangman(el.theme.value);
       }
     };
   });


   // Theme Selector Logic
   el.theme.onchange = () => {
       if(isPlaying && !hasInteracted && currentMode === 'classic') {
           setupHangman(el.theme.value);
           updateHeader();
       }
   };


   el.btnNew.onclick = () => startGame('classic');
   el.btnSurv.onclick = () => startGame('survivor');
   el.btnDaily.onclick = () => startGame('daily');
   el.btnWordle.onclick = () => startGame('wordle');
   el.btnQuordle.onclick = () => startGame('quordle');
   el.btnQuit.onclick = quitGame;
   el.btnHint.onclick = useHint;
   el.ovNext.onclick = nextRound;
   el.ovExit.onclick = () => { el.overlay.style.display='none'; quitGame(); };


   document.addEventListener('keydown', e => {
     if(!isPlaying) return;
     const k = e.key.toUpperCase();
     if(k === 'ENTER') handleInput('ENTER');
     else if(k === 'BACKSPACE') handleInput('BACK');
     else if(/^[A-Z]$/.test(k) && e.key.length === 1) handleInput(k);
   });


   renderKeyboard();
   updateHeader();
 }


 /* --- 5. LOGIC ROUTER --- */
 function startGame(mode){
   currentMode = mode;
   isPlaying = true;
   hasInteracted = false;
   toggleSettings(false);


   el.btnQuit.style.display = 'inline-block';
   [el.btnNew, el.btnSurv, el.btnDaily, el.btnWordle, el.btnQuordle].forEach(b => b.style.display='none');
  
   el.board.innerHTML = '';
   resetKeyboard();
  
   if(mode === 'classic'){
     score = 0;
     setupHangman(el.theme.value);
   } else if(mode === 'survivor'){
     if(survRound===1) score=0;
     el.roundBox.style.display='flex';
     el.round.textContent = survRound;
     const keys = Object.keys(META);
     const randTheme = keys[Math.floor(Math.random()*keys.length)];
     setupHangman(randTheme);
   } else if(mode === 'daily'){
     const now = new Date();
     const start = new Date(now.getFullYear(), 0, 0);
     const diff = now - start;
     const oneDay = 1000 * 60 * 60 * 24;
     const dayOfYear = Math.floor(diff / oneDay);
     const seed = now.getFullYear() * 1000 + dayOfYear;
     const keys = Object.keys(META);
     const thIdx = seed % keys.length;
     setupHangman(keys[thIdx], true, seed);
   } else if(mode === 'wordle'){
     score=0;
     setupGridGame(1, 6);
   } else if(mode === 'quordle'){
     score=0;
     setupGridGame(4, 9);
   }
   updateHeader();
 }


 function quitGame(){
   isPlaying = false;
   currentMode = 'classic';
   survRound = 1;
   hasInteracted = false;
   toggleSettings(false);


   el.btnQuit.style.display='none';
   [el.btnNew, el.btnSurv, el.btnDaily, el.btnWordle, el.btnQuordle].forEach(b => b.style.display='inline-block');
   el.board.innerHTML = '<div style="text-align:center; color:var(--muted); font-size:1.2rem; animation:float 3s ease infinite;">Select a Game Mode to Start</div>';
   el.roundBox.style.display='none';
  
   // VISUAL KEYBOARD RESET
   resetKeyboard();
  
   updateHeader();
 }


 function toggleSettings(locked){
   if(locked){
     el.theme.disabled = true;
     el.livesSel.classList.add('locked');
   } else {
     el.theme.disabled = false;
     el.theme.style.display = 'block';
     el.livesSel.classList.remove('locked');
     el.livesSel.style.display = 'flex';
   }
 }


 /* --- 6. HANGMAN ENGINE --- */
 function setupHangman(theme, seeded=false, seedVal=0){
   if(currentMode !== 'classic') el.theme.style.display = 'none';
   else el.theme.style.display = 'block';
  
   el.livesSel.style.display = 'flex';
   el.livesBox.style.display = 'flex';


   if(currentMode === 'classic') el.theme.value = theme;
  
   const list = HANGMAN_DATA[theme];
   let word;
   if(seeded){
     let idx = (seedVal * 9301 + 49297) % list.length;
     word = list[idx];
   } else {
     word = list[Math.floor(Math.random()*list.length)];
   }


   gameState = {
     type: 'hangman',
     themeKey: theme,
     word: word,
     hidden: new Set([...word].filter(c=>/[A-Z]/.test(c))),
     guessed: new Set(),
     lives: customLives
   };


   updateLives(gameState.lives);


   const wrap = document.createElement('div');
   wrap.className = 'hangman-wrap';
   for(const char of word){
     const t = document.createElement('div');
     t.className = /[A-Z]/.test(char) ? 'hm-tile' : 'hm-tile space';
     t.dataset.char = char;
     if(!/[A-Z]/.test(char) && char!==' ') t.textContent = char;
     wrap.appendChild(t);
   }
   el.board.appendChild(wrap);
 }


 function handleHangman(char){
   if(!hasInteracted) {
       hasInteracted = true;
       toggleSettings(true);
   }


   if(gameState.lives <= 0 || gameState.guessed.has(char)) return;
   gameState.guessed.add(char);


   const btn = document.getElementById(`key-${char}`);
  
   if(gameState.word.includes(char)){
     document.querySelectorAll(`.hm-tile[data-char="${char}"]`).forEach(t => {
       t.textContent = char;
       t.classList.add('revealed');
     });
     if(btn) btn.classList.add('used-good');
     const allFound = [...gameState.hidden].every(c => gameState.guessed.has(c));
     if(allFound) gameOver(true);
   } else {
     gameState.lives--;
     updateLives(gameState.lives);
     triggerShake();
     if(btn) btn.classList.add('used-bad');
     if(gameState.lives <= 0) gameOver(false);
   }
 }


 /* --- 7. GRID ENGINE --- */
 function setupGridGame(numBoards, guesses){
   el.livesBox.style.display='none';
   el.livesSel.style.display='none';
   el.theme.style.display='none';


   gameState = {
     type: 'grid',
     boards: [],
     guesses: [],
     buffer: "",
     maxGuesses: guesses,
     active: true
   };


   for(let i=0; i<numBoards; i++){
     let w;
     if(numBoards===4 && i>=2) w = WORDS_HARD[Math.floor(Math.random()*WORDS_HARD.length)];
     else w = WORDS_EASY[Math.floor(Math.random()*WORDS_EASY.length)];
     gameState.boards.push({ word: w, solved: false });
   }


   const wrap = document.createElement('div');
   wrap.className = numBoards===4 ? 'grid-wrap quordle' : 'grid-wrap';
  
   gameState.boards.forEach((b, bIdx) => {
     const bDiv = document.createElement('div');
     bDiv.className = 'wordle-board';
     for(let r=0; r<guesses; r++){
       const row = document.createElement('div');
       row.className = 'w-row';
       row.id = `b${bIdx}-r${r}`;
       for(let t=0; t<5; t++){
         const tile = document.createElement('div');
         tile.className = 'w-tile';
         tile.id = `b${bIdx}-r${r}-t${t}`;
         row.appendChild(tile);
       }
       bDiv.appendChild(row);
     }
     wrap.appendChild(bDiv);
   });
   el.board.appendChild(wrap);
 }


 function handleGrid(val){
   if(!gameState.active) return;
   if(!hasInteracted) hasInteracted = true;


   el.board.classList.remove('shake');


   if(val === 'ENTER') submitGridGuess();
   else if(val === 'BACK') {
     gameState.buffer = gameState.buffer.slice(0, -1);
     updateGridUI();
   } else if(gameState.buffer.length < 5) {
     gameState.buffer += val;
     updateGridUI();
   }
 }


 function updateGridUI(){
   const r = gameState.guesses.length;
   if(r >= gameState.maxGuesses) return;
   gameState.boards.forEach((b, bIdx) => {
     if(b.solved) return;
     for(let t=0; t<5; t++){
       const tile = document.getElementById(`b${bIdx}-r${r}-t${t}`);
       const char = gameState.buffer[t] || "";
       tile.textContent = char;
       tile.classList.toggle('filled', char!=="");
     }
   });
 }


 function submitGridGuess(){
   const guess = gameState.buffer;
   if(guess.length !== 5) return;


   // FIX: DICTIONARY CHECK IS TOO STRICT FOR A DEMO
   // We only check length, because the built-in dictionary is too small (400 words)
   // to act as a proper spellchecker. This prevents user frustration.
   // if(!FULL_DICT.has(guess)) { triggerShake(); return; }


   const r = gameState.guesses.length;
   gameState.guesses.push(guess);
   gameState.buffer = "";
  
   let allSolved = true;
   gameState.boards.forEach((b, bIdx) => {
     if(b.solved) return;
    
     const colors = getColors(guess, b.word);
     for(let t=0; t<5; t++){
       const tile = document.getElementById(`b${bIdx}-r${r}-t${t}`);
       setTimeout(() => {
         tile.textContent = guess[t];
         tile.classList.add(colors[t]);
         updateKeyColor(guess[t], colors[t]);
       }, t * 100);
     }


     if(guess === b.word){
       b.solved = true;
       setTimeout(() => { document.getElementById(`b${bIdx}-r${r}`).parentElement.classList.add('solved'); }, 600);
     } else {
       allSolved = false;
     }
   });


   if(allSolved) setTimeout(()=>gameOver(true), 1000);
   else if(gameState.guesses.length >= gameState.maxGuesses) setTimeout(()=>gameOver(false), 1000);
 }


 function getColors(guess, target){
   const res = Array(5).fill('absent');
   const tArr = [...target];
   const gArr = [...guess];
   gArr.forEach((c,i) => {
     if(c === tArr[i]){
       res[i] = 'correct';
       tArr[i] = null; gArr[i] = null;
     }
   });
   gArr.forEach((c,i) => {
     if(c!==null && tArr.includes(c)){
       res[i] = 'present';
       tArr[tArr.indexOf(c)] = null;
     }
   });
   return res;
 }


 /* --- 8. UTILITIES --- */
 function handleInput(val){
   if(!isPlaying) return; // Strict Lock
   if(gameState.type === 'hangman') {
     if(val!=='ENTER' && val!=='BACK') handleHangman(val);
   } else {
     handleGrid(val);
   }
 }


 function triggerShake(){
   el.board.classList.remove('shake');
   void el.board.offsetWidth;
   el.board.classList.add('shake');
   el.flash.classList.add('active');
   setTimeout(()=>el.flash.classList.remove('active'), 200);
 }


 function updateLives(n){
   el.livesTxt.textContent = n;
   el.hearts.innerHTML = '';
   for(let i=0; i<n; i++){
     const h = document.createElement('div'); h.className='heart';
     el.hearts.appendChild(h);
   }
 }


 function useHint(){
   if(!isPlaying) return;
   if(gameState.type !== 'hangman') { alert('Hints only available in Classic/Survivor/Daily'); return; }
  
   if(!hasInteracted) {
       hasInteracted = true;
       toggleSettings(true);
   }


   if(gameState.lives <= 1) return;
  
   const avail = [...gameState.hidden].filter(c => !gameState.guessed.has(c));
   if(avail.length){
     gameState.lives--;
     updateLives(gameState.lives);
     handleHangman(avail[Math.floor(Math.random()*avail.length)]);
   }
 }


 function gameOver(win){
   isPlaying = false;
   el.overlay.style.display = 'grid';
   el.ovTitle.textContent = win ? "VICTORY" : "GAME OVER";
   el.ovTitle.style.color = win ? "var(--good)" : "var(--bad)";
  
   if(gameState.type === 'hangman'){
     el.ovText.innerHTML = win ? "You guessed it!" : `Answer:<br><b style="color:#fff; font-size:1.5rem">${gameState.word}</b>`;
     if(win) score += 100;
     else if(currentMode === 'survivor') survRound = 0; // FIX: Reset logic
   } else {
     el.ovText.innerHTML = win ? "Puzzle Solved!" : `Answers:<br>${gameState.boards.map(b=>b.word).join(', ')}`;
     if(win) score += (gameState.maxGuesses - gameState.guesses.length) * 50;
   }
   el.score.textContent = score;
 }


 function nextRound(){
   el.overlay.style.display = 'none';
   if(currentMode === 'survivor'){
     survRound++;
     startGame('survivor');
   } else {
     startGame(currentMode);
   }
 }


 function updateHeader(){
   if(currentMode === 'wordle'){
     el.hEmoji.textContent = '🟩'; el.hTitle.textContent = 'Wordle';
     document.documentElement.style.setProperty('--accent', '#22c55e');
   } else if(currentMode === 'quordle'){
     el.hEmoji.textContent = '🔢'; el.hTitle.textContent = 'Quordle';
     document.documentElement.style.setProperty('--accent', '#a855f7');
   } else if(currentMode === 'survivor' || currentMode === 'daily') {
     const tKey = gameState.themeKey;
     if(tKey && META[tKey]) {
         el.hEmoji.textContent = META[tKey].emoji;
         el.hTitle.textContent = META[tKey].title;
     } else {
         el.hEmoji.textContent = '🎮'; el.hTitle.textContent = 'Game Hub';
     }
     document.documentElement.style.setProperty('--accent', '#3b82f6');
   } else {
     const t = META[el.theme.value];
     el.hEmoji.textContent = t.emoji; el.hTitle.textContent = t.title + " Guess";
     document.documentElement.style.setProperty('--accent', '#3b82f6');
   }
 }


 function renderKeyboard(){
   el.kbd.innerHTML = '';
   const rows = ["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];
   rows.forEach((rStr, i) => {
     const r = document.createElement('div'); r.className = 'rowk';
     if(i===2){
        const en = document.createElement('div'); en.className='key'; en.id='ENTER'; en.textContent='ENTER';
        en.onclick=()=>handleInput('ENTER'); r.appendChild(en);
     }
     for(const char of rStr){
       const k = document.createElement('div'); k.className='key'; k.id=`key-${char}`; k.textContent=char;
       k.onclick=()=>handleInput(char); r.appendChild(k);
     }
     if(i===2){
        const bk = document.createElement('div'); bk.className='key'; bk.id='BACK'; bk.textContent='⌫';
        bk.onclick=()=>handleInput('BACK'); r.appendChild(bk);
     }
     el.kbd.appendChild(r);
   });
 }


 function resetKeyboard(){
   document.querySelectorAll('.key').forEach(k => {
     // RESET ALL CLASSES
     k.className = 'key';
     if(k.id==='ENTER'||k.id==='BACK') k.className = 'key'; // Keep structure
   });
 }


 function updateKeyColor(char, status){
   const k = document.getElementById(`key-${char}`);
   if(!k) return;
   if(status==='correct') k.className='key correct';
   else if(status==='present' && !k.classList.contains('correct')) k.className='key present';
   else if(status==='absent' && !k.classList.contains('correct') && !k.classList.contains('present')) k.className='key absent';
 }


 init();
})();
</script>
</body>
</html>
